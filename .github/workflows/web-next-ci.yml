name: web-next-ci

on:
  pull_request:
    paths:
      - "apps/web-next/**"
      - ".github/workflows/web-next-ci.yml"
  push:
    branches: ["main", "master", "stable-tanmay2"]
    paths:
      - "apps/web-next/**"
      - ".github/workflows/web-next-ci.yml"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-next

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
