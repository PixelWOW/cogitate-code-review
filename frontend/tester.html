<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester - Cogitate Excel Rater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-left">
        <div class="logo-icon tester-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <div>
          <h1>Cogitate Excel Rater - Tester</h1>
          <p>Run rating tests from templates/ or raters/ folders</p>
        </div>
      </div>
      <a href="index.html" class="header-badge">Back</a>
    </div>
  </header>

  <div class="tester-container">
    <!-- Step 1: Select source + rater -->
    <div class="step-panel">
      <div class="step-header">
        <span class="step-num">1</span>
        <h2>Select Rater</h2>
      </div>
      <div class="step-body">
        <div class="select-row">
          <label class="inline-label">Source
            <select id="source-select" onchange="onSourceChange()">
              <option value="templates">templates/</option>
              <option value="raters">raters/</option>
            </select>
          </label>
          <label class="inline-label">Rater
            <select id="rater-select">
              <option value="">Loading...</option>
            </select>
          </label>
          <button id="load-btn" onclick="loadRater()">Load Config</button>
        </div>
        <div id="load-status" class="step-status"></div>
      </div>
    </div>

    <!-- Step 2: Dynamic form + output -->
    <div id="step-calculate" style="display:none">
      <div class="rater-layout">
        <div class="panel" id="input-panel">
          <div class="panel-header"><h2>Inputs</h2></div>
          <div id="form-container"></div>
        </div>
        <div class="panel" id="output-panel">
          <div class="panel-header"><h2>Outputs</h2></div>
          <div id="output-container"></div>
          <button id="calc-btn" onclick="doCalculate()">Calculate</button>
          <button id="download-btn" onclick="doDownload()" class="download-btn">Download Calculated Excel</button>
          <div id="calc-status" class="step-status"></div>
        </div>
      </div>
    </div>
  </div>

  <footer><p>Cogitate Excel Rater v2.0 &middot; Tester Mode</p></footer>

  <script src="app.js"></script>
  <script>
    let currentConfig = null;
    let currentSlug = null;
    let currentSource = "templates";

    // Load rater list for the selected source
    async function loadList(source) {
      const statusEl = document.getElementById("load-status");
      const sel = document.getElementById("rater-select");
      sel.innerHTML = '<option value="">Loading...</option>';

      try {
        const res = await fetch(API + "/api/" + source);
        if (!res.ok) throw new Error("Failed to fetch " + source);
        const list = await res.json();
        sel.innerHTML = '<option value="">-- select a rater --</option>';
        for (const t of list) {
          const opt = document.createElement("option");
          opt.value = t.slug;
          opt.textContent = t.name || t.slug;
          sel.appendChild(opt);
        }
        if (list.length === 0) {
          sel.innerHTML = '<option value="">No raters found in ' + source + '/</option>';
        }
        statusEl.textContent = "";
        statusEl.className = "step-status";
      } catch (e) {
        sel.innerHTML = '<option value="">Error loading</option>';
        statusEl.textContent = "Error: " + e.message;
        statusEl.className = "step-status";
      }
    }

    function onSourceChange() {
      currentSource = document.getElementById("source-select").value;
      document.getElementById("step-calculate").style.display = "none";
      loadList(currentSource);
    }

    // Load config for selected rater
    async function loadRater() {
      const slug = document.getElementById("rater-select").value;
      if (!slug) return;

      const statusEl = document.getElementById("load-status");
      statusEl.textContent = "Loading...";

      try {
        const res = await fetch(API + "/api/" + currentSource + "/" + slug + "/config");
        if (!res.ok) throw new Error("Config not found");
        currentConfig = await res.json();
        currentSlug = slug;

        renderForm(document.getElementById("form-container"), currentConfig);
        renderOutputPanel(document.getElementById("output-container"), currentConfig);
        document.getElementById("step-calculate").style.display = "block";
        const mode = currentConfig.mode || "flat";
        const scheduleCount = Array.isArray(currentConfig.schedules) ? currentConfig.schedules.length : 0;
        statusEl.textContent = "Loaded from " + currentSource + "/" + slug + ": mode=" + mode + ", schedules=" + scheduleCount + ", " + currentConfig.inputs.length + " inputs, " + currentConfig.outputs.length + " outputs";
        statusEl.className = "step-status success";
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
        statusEl.className = "step-status";
        document.getElementById("step-calculate").style.display = "none";
      }
    }

    // Calculate
    async function doCalculate() {
      if (!currentConfig || !currentSlug) return;

      const btn = document.getElementById("calc-btn");
      const statusEl = document.getElementById("calc-status");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Calculating...';
      statusEl.textContent = "";

      const inputs = collectInputs(currentConfig);

      try {
        const res = await fetch(API + "/api/" + currentSource + "/" + currentSlug + "/calculate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(inputs),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Server error " + res.status);
        }

        const data = await res.json();
        displayOutputs(currentConfig, data.outputs);
        statusEl.textContent = "Calculation successful";
        statusEl.className = "step-status success";
      } catch (e) {
        clearOutputs(currentConfig);
        statusEl.textContent = "Error: " + e.message;
        statusEl.className = "step-status";
      } finally {
        btn.disabled = false;
        btn.textContent = "Calculate";
      }
    }

    // Download calculated Excel
    async function doDownload() {
      if (!currentConfig || !currentSlug) return;

      const btn = document.getElementById("download-btn");
      const statusEl = document.getElementById("calc-status");
      btn.disabled = true;
      btn.textContent = "Downloading...";

      const inputs = collectInputs(currentConfig);

      try {
        const res = await fetch(API + "/api/" + currentSource + "/" + currentSlug + "/calculate-and-download", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(inputs),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Server error " + res.status);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = currentSlug + "_calculated.xlsx";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.textContent = "Excel downloaded — open it to verify inputs were written correctly";
        statusEl.className = "step-status success";
      } catch (e) {
        statusEl.textContent = "Download error: " + e.message;
        statusEl.className = "step-status";
      } finally {
        btn.disabled = false;
        btn.textContent = "Download Calculated Excel";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadList("templates");
    });
  </script>
</body>
</html>
